name: Governance enforcement

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - run: npm run governance:migrate-history
      - run: npm run governance:test
      - run: npm run validate
      - name: Publicar artefatos ACT-F00-008
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-f00-008-migration-artifacts
          path: governance/artifacts/migrations/act-f00-008
          if-no-files-found: error
