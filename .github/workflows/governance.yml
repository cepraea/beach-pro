name: Governance enforcement

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - run: npm run governance:migrate-history
      - run: npm run governance:test
      - run: npm run validate
      - name: Persistir artefatos ACT-F00-008 na branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [[ -n "$(git status --porcelain -- governance/artifacts/migrations/act-f00-008)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add governance/artifacts/migrations/act-f00-008
            git commit -m "Persistir evidências ACT-F00-008 [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Publicar artefatos ACT-F00-008
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-f00-008-migration-artifacts
          path: governance/artifacts/migrations/act-f00-008
          if-no-files-found: error
