    title: 'confirmação humana de Davi: composição do CEPRAEA, autoridade exclusiva interna, retorno de
      Gilvania e aprovação das decisões `DEC-002` a `DEC-018`, incluindo a `DEC-016-A`. Inclui escala
      19 mais 1; fluxo integral na PWA; custo R$ 0; desenvolvimento solo; limites dos agentes e ausência
      de APIs da OpenAI e Anthropic; modelo de respostas e justificativas; distinção entre estados e fatos;
      proibição de julgamento automático; governança e portão de dados reais; visibilidade operacional
      mínima; arquitetura gratuita com Cloudflare Pages, Supabase/PostgreSQL/Auth/RLS em São Paulo, Brevo
      SMTP, GitHub privado, ambientes separados, backup próprio, restauração, monitoramento de cotas e
      portabilidade; planejamento de 8 horas semanais, horizonte de 24 semanas após D0 e marcos M0 a M6;
      continuidade proporcional sem custodiante ou conta emergencial; somente dois perfis operacionais,
      Davi e atleta; e linha de base proporcional, indicadores `IND-001` a `IND-010`, metas iniciais,
      validação V0 a V3, piloto controlado e critérios de promoção documental sem autorização automática
      de dados reais, piloto ou produção'
