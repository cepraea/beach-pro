## CEPRAEA-BEACH-PRO — Codex Reviewer Policy (project-level)
##
## Papel REVIEWER: projeto read-only, escrita efêmera apenas em /tmp/caches autorizados,
## sem rede durante review normal.
##
## Referência arquitetural:
##   docs/arquiteturas/multi-agentes/main/Human-Governed Dual-Agent SDLC Architecture.md
##
## O enforcement definitivo também depende de /etc/codex/requirements.toml no Dev Container.

default_permissions = "cepraea-review"
approval_policy = "never"

[permissions.cepraea-review]
description = "CEPRAEA reviewer: projeto read-only, temp efêmero writable, sem rede"

[permissions.cepraea-review.filesystem]
":minimal" = "read"
":tmpdir"  = "write"
":slash_tmp" = "write"

[permissions.cepraea-review.filesystem.":workspace_roots"]
"." = "read"
"**/*.env" = "deny"

[permissions.cepraea-review.network]
enabled = false
